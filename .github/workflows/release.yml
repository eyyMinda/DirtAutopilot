name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1). Updates manifest.json, commits, tags and releases."
        required: true
        type: string

permissions:
  contents: write

env:
  MOD_ID: eyyMinda-DirtAutopilot

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a valid semantic version (X.Y.Z)"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump manifest, commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          jq --tab --arg v "${{ steps.ver.outputs.version }}" '.version_number = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet manifest.json; then
            git commit -am "Release $TAG"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Check manifest version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r '.version_number' manifest.json)
          if [ "$MANIFEST_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::manifest.json version_number ($MANIFEST_VERSION) does not match tag (${{ steps.ver.outputs.version }})"; exit 1
          fi

      - name: Build zip
        id: zip
        run: |
          mkdir -p build
          ZIP="build/${MOD_ID}-${{ steps.ver.outputs.version }}.zip"
          # Godot Mod Loader layout: mods-unpacked/<Namespace-Name>/...
          git archive --format=zip --prefix="mods-unpacked/${MOD_ID}/" -o "$ZIP" "${{ steps.ver.outputs.tag }}"
          unzip -l "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.zip.outputs.path }}" \
            --title "Dirt Autopilot ${{ steps.ver.outputs.tag }}" \
            --generate-notes
